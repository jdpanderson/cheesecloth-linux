name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"
      - name: Install GNOME build tool
        run: npm install --prefix gnome --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Check GNOME TypeScript and compiled JavaScript
        run: |
          npm run --prefix gnome check
          npm run --prefix gnome build
          git diff --exit-code -- gnome/dist
          node --check gnome/dist/api.js
          node --check gnome/dist/display.js
          node --check gnome/dist/protocol.js
          node --check gnome/dist/extension.js
          node --check gnome/dist/app.js
          npm run --prefix gnome test

  gnome:
    name: GNOME ${{ matrix.shell }} runtime
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: '48'
            image: debian:trixie
          - shell: '49'
            image: fedora:43
          - shell: '50'
            image: fedora:44
          - shell: '51'
            image: fedora:45
    steps:
      - name: Install GNOME runtime and test tools
        run: |
          if command -v dnf; then
            dnf install -y git nodejs npm gjs gnome-shell libadwaita gtk4 dbus-daemon dbus-tools python3-dbusmock mesa-dri-drivers xorg-x11-server-Xvfb xorg-x11-xauth shadow-utils
          else
            apt-get update
            apt-get install -y --no-install-recommends git nodejs npm gjs gnome-shell gir1.2-adw-1 gir1.2-gtk-4.0 dbus-daemon dbus-bin python3-dbusmock libgl1-mesa-dri xvfb xauth passwd
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test GJS socket client
        run: npm run --prefix gnome test:gjs
      - name: Test Adwaita widgets
        run: dbus-run-session -- xvfb-run -a gjs -m gnome/tests/widgets.gjs.mjs
      - name: Test packaged Shell extension
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          # GNOME Shell needs a login manager on the system bus.
          install -d -m 755 /run/dbus
          dbus-uuidgen --ensure
          dbus-daemon --system --fork
          test -S /run/dbus/system_bus_socket
          mkdir -p target/gnome-runtime
          chmod 700 target/gnome-runtime
          install -Dm644 gnome/metadata.json /usr/share/gnome-shell/extensions/cheesecloth-gnome@janderson.ca/metadata.json
          install -Dm644 gnome/dist/*.js -t /usr/share/gnome-shell/extensions/cheesecloth-gnome@janderson.ca
          useradd --create-home tester
          chown -R tester:tester target
          runuser -u tester -- dbus-send --system --print-reply --dest=org.freedesktop.DBus \
            /org/freedesktop/DBus org.freedesktop.DBus.GetId
          python3 -m dbusmock --system --template logind --exec gnome/tests/run-shell-test.sh

  # Reads the pin once, so the other jobs build the same source, and checks
  # that the packages agree with it.
  pin:
    name: Pin
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.pin.outputs.ref }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The format is set in cheesecloth's docs/REPOSITORIES.md. This
      # repository builds from source, so a release pin lists no binaries.
      - name: Read cheesecloth.pin
        id: pin
        shell: python3 {0}
        run: |
          import os, re, sys, tomllib
          with open("cheesecloth.pin", "rb") as f:
              pin = tomllib.load(f)
          if pin.keys() == {"commit"}:
              commit = pin["commit"]
              if not isinstance(commit, str) or not re.fullmatch(r"[0-9a-f]{40}", commit):
                  sys.exit(f"::error::the commit in cheesecloth.pin is not a full commit id: {commit}")
              ref = commit
          elif pin.keys() == {"release"}:
              release = pin["release"]
              if not isinstance(release, str) or not re.fullmatch(r"[0-9][0-9A-Za-z.-]*", release):
                  sys.exit(f"::error::the release in cheesecloth.pin is not a version: {release}")
              ref = f"refs/tags/v{release}"
          else:
              sys.exit("::error::cheesecloth.pin must hold only \"commit\" or only \"release\"")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"ref={ref}\n")
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jdpanderson/cheesecloth
          ref: ${{ steps.pin.outputs.ref }}
          path: cheesecloth
          sparse-checkout: Cargo.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # The PKGBUILD holds its own copy of the pin, and both packages name
      # the version they package. They must match cheesecloth.pin, the
      # version in cheesecloth's Cargo.toml, and each other. A tag here must
      # name the pinned release and the package revision.
      - name: Check the packages match the pin
        id: check
        shell: python3 {0}
        run: |
          import os, re, subprocess, sys, tomllib
          with open("cheesecloth.pin", "rb") as f:
              pin = tomllib.load(f)
          with open("cheesecloth/Cargo.toml", "rb") as f:
              version = tomllib.load(f)["workspace"]["package"]["version"]
          base_version, _, cargo_suffix = version.partition("-")
          if "commit" in pin:
              ref, suffix = f"commit={pin['commit']}", cargo_suffix
          else:
              release = pin["release"]
              ref = f"tag=v{release}"
              # Old tags may add a suffix to a plain Cargo version. A Cargo
              # pre-release already has its full suffix in Cargo.toml.
              release_suffix = release.removeprefix(base_version)
              if (release_suffix == release or
                      not re.fullmatch(r"(-?[A-Za-z][0-9A-Za-z.]*)?", release_suffix) or
                      (cargo_suffix and release != version)):
                  sys.exit(f"::error::release {release} in cheesecloth.pin does not match version {version}")
              suffix = release_suffix.removeprefix("-")
          # A suffix sorts before the plain version: "0.4.0~pre0" for Debian,
          # and "0.4.0pre0" for pacman, which has no "-" in pkgver.
          debian_version = base_version + (f"~{suffix}" if suffix else "")
          arch_version = base_version + suffix

          pkgbuild = subprocess.run(
              ["bash", "-c", 'source arch/PKGBUILD && printf "%s\\n" "$_ref" "$pkgver" "$pkgrel"'],
              check=True, capture_output=True, text=True).stdout.split("\n")
          pkg_ref, pkgver, pkgrel = pkgbuild[:3]
          changelog = subprocess.run(["dpkg-parsechangelog", "-S", "Version"],
              check=True, capture_output=True, text=True).stdout.strip()
          deb_upstream, _, deb_revision = changelog.rpartition("-")

          errors = []
          if pkg_ref != ref:
              errors.append(f"_ref in arch/PKGBUILD is {pkg_ref}, not {ref}")
          if pkgver != arch_version:
              errors.append(f"pkgver in arch/PKGBUILD is {pkgver}, not {arch_version}")
          if deb_upstream != debian_version:
              errors.append(f"debian/changelog has {changelog}, not {debian_version}-<revision>")
          if deb_revision != pkgrel:
              errors.append(f"debian/changelog has revision {deb_revision}, but pkgrel is {pkgrel}")
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              tag = os.environ["GITHUB_REF_NAME"]
              if "release" not in pin:
                  errors.append(f"tag {tag} needs a release in cheesecloth.pin, not a commit")
              elif tag != f"v{pin['release']}-{pkgrel}":
                  errors.append(f"tag {tag} is not v{pin['release']}-{pkgrel}")
          for error in errors:
              print(f"::error::{error}")
          if errors:
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"prerelease={'true' if suffix else 'false'}\n")

  debian:
    name: Debian 13 (${{ matrix.arch }})
    needs: pin
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # Trixie's cargo is older than cheesecloth's rust-version.
      - name: Install build dependencies
        run: |
          printf '%s\n' 'deb http://deb.debian.org/debian trixie-backports main' > /etc/apt/sources.list.d/backports.list
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper git ca-certificates procps \
            cargo/trixie-backports rustc/trixie-backports
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jdpanderson/cheesecloth
          ref: ${{ needs.pin.outputs.ref }}
          path: cheesecloth
          persist-credentials: false
      # Older cheesecloth commits still have their own debian/; this one
      # replaces it.
      - name: Add debian/ to the source
        run: |
          rm -rf cheesecloth/debian
          cp -r debian cheesecloth/
          cp -r gnome cheesecloth/
      # cheesecloth's own CI runs the tests.
      - name: Build package
        working-directory: cheesecloth
        env:
          DEB_BUILD_OPTIONS: nocheck
        run: dpkg-buildpackage -us -uc -b -jauto
      - name: Check package
        run: |
          mkdir dist
          cp ./*.deb dist/
          dpkg-deb --info dist/cheesecloth_*.deb
          dpkg-deb --extract dist/cheesecloth_*.deb "$RUNNER_TEMP/package"
          test -f "$RUNNER_TEMP/package/usr/lib/systemd/system/cheesecloth.service"
          test -f "$RUNNER_TEMP/package/etc/default/cheesecloth"
          dpkg-deb --info dist/gnome-shell-extension-cheesecloth_*.deb
          dpkg-deb --extract dist/gnome-shell-extension-cheesecloth_*.deb "$RUNNER_TEMP/extension"
          test -f "$RUNNER_TEMP/extension/usr/share/gnome-shell/extensions/cheesecloth-gnome@janderson.ca/extension.js"
          test -f "$RUNNER_TEMP/extension/usr/share/gnome-shell/extensions/cheesecloth-gnome@janderson.ca/protocol.js"
          test -f "$RUNNER_TEMP/extension/usr/lib/systemd/system/cheesecloth.service.d/10-gnome.conf"
          apt-get install -y ./dist/cheesecloth_*.deb
          cheesecloth --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cheesecloth-debian13-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error
          compression-level: 0

  # There is no Arch Linux container for arm64, so only x86_64 is built.
  arch:
    name: Arch Linux (x86_64)
    needs: pin
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 60
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git rust openresolv
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # makepkg fetches the tag or commit in the PKGBUILD; the pin job checked
      # that it is the pinned one. cheesecloth's own CI runs the tests.
      - name: Build package
        working-directory: arch
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- makepkg --noconfirm --nocheck
      - name: Check package
        run: |
          mkdir dist
          cp arch/*.pkg.tar.zst dist/
          pacman -Qip dist/cheesecloth-[0-9]*.pkg.tar.zst
          mkdir -p "$RUNNER_TEMP/package"
          tar -xf dist/cheesecloth-[0-9]*.pkg.tar.zst -C "$RUNNER_TEMP/package"
          test -f "$RUNNER_TEMP/package/usr/lib/systemd/system/cheesecloth.service"
          test -f "$RUNNER_TEMP/package/etc/default/cheesecloth"
          tar -xf dist/gnome-shell-extension-cheesecloth-*.pkg.tar.zst -C "$RUNNER_TEMP/package"
          test -f "$RUNNER_TEMP/package/usr/share/gnome-shell/extensions/cheesecloth-gnome@janderson.ca/extension.js"
          test -f "$RUNNER_TEMP/package/usr/share/gnome-shell/extensions/cheesecloth-gnome@janderson.ca/protocol.js"
          test -f "$RUNNER_TEMP/package/usr/lib/systemd/system/cheesecloth.service.d/10-gnome.conf"
          pacman -U --noconfirm dist/cheesecloth-[0-9]*.pkg.tar.zst
          cheesecloth --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cheesecloth-arch-x86_64
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0

  # A tag v<release>-<revision>, such as v0.4.0-1, publishes the packages. The
  # pin job checked that the tag matches the pin and the packages.
  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [lint, gnome, pin, debian, arch]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: cheesecloth-*
          merge-multiple: true
      # pacman -U <url> needs <url>.sig next to the package. See README.md.
      # The key is used only here, so jobs that run cargo build scripts never
      # see it.
      - name: Sign the Arch packages
        env:
          ARCH_SIGNING_KEY: ${{ secrets.ARCH_SIGNING_KEY }}
        run: |
          if [[ -z "$ARCH_SIGNING_KEY" ]]; then
            echo "::error::the ARCH_SIGNING_KEY secret is not set"
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          gpg --batch --import <<< "$ARCH_SIGNING_KEY"
          for package in dist/*.pkg.tar.zst; do
            gpg --batch --yes --detach-sign --no-armor "$package"
            gpg --batch --verify "$package.sig" "$package"
          done
          rm -rf "$GNUPGHOME"
      # GitHub turns "~" in an asset name into ".", so a Debian pre-release
      # such as cheesecloth_0.4.0~pre0-1_amd64.deb is renamed here, before
      # SHA256SUMS is made. apt reads the version from the package, not the
      # file name.
      - name: Name the Debian packages for GitHub
        run: |
          for package in dist/*~*.deb; do
            [[ -e "$package" ]] || continue
            mv -- "$package" "${package//\~/.}"
          done
      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.pin.outputs.prerelease }}
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          ls -l
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber -- *
          else
            flags=()
            [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
            gh release create "$TAG" --verify-tag --generate-notes "${flags[@]}" -- *
          fi
      # GitHub renames assets with some characters in their names. SHA256SUMS
      # and the install docs use the file names, so they must not change
      # after the step that names the Debian packages.
      - name: Check the asset names
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > "$RUNNER_TEMP/assets"
          (cd dist && printf '%s\n' *) | sort > "$RUNNER_TEMP/files"
          diff -u "$RUNNER_TEMP/files" "$RUNNER_TEMP/assets"
